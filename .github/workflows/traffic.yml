name: Collect hourly blog traffic
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: traffic-data
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-strip-types --test scripts/traffic-stats.test.mjs
      - run: node scripts/collect-traffic.mjs
        env:
          GH_TOKEN: ${{ github.token }}
